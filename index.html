<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="/xeniatravel/favicon.ico" />
    <link href="https://fonts.googleapis.com/css?family=Caveat&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Montserrat&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Xenia Travels</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #f8f8f8;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .image-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .image-grid img {
            max-width: 300px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-family: 'Caveat', cursive;
            font-size: 3rem;
            color: #333;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 1.5rem;
            border: 1px solid #333;
            background-color: #f0f0f0;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #ddd;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .image-grid {
                flex-direction: column;
            }

            button {
                font-size: 1.2rem;
                padding: 8px 16px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="image-grid">
            <img src="image1.jpg" alt="Фото 1">
            <img src="image2.jpg" alt="Фото 2">
            <img src="image3.jpg" alt="Фото 3">
            <img src="image4.jpg" alt="Фото 4">
        </div>
        <h1>Ксения - путешественница</h1>
        <button>Выбрать страну</button>
    </div>
</body>

</html>
